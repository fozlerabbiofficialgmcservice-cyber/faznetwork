# fly.toml app configuration file generated for faznetwork on 2026-10-01T18:38:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'faznetwork'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 9091
  path = '/metrics'
