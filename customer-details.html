<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্রাহকের পূর্ণাঙ্গ তথ্য</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 25px; }
        .profile-card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 25px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 750px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="admin.html" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> ড্যাশবোর্ডে ফিরুন</a>
        <button class="btn btn-sm btn-outline-primary" onclick="loadCustomerInfo()"><i class="fas fa-sync"></i> রিফ্রেশ</button>
    </div>

    <div class="profile-card">
        <h4 class="text-success border-bottom pb-2 mb-3"><i class="fas fa-id-card me-2"></i>গ্রাহকের পূর্ণাঙ্গ প্রোফাইল</h4>

        <div id="loading" class="text-center py-4">তথ্য লোড হচ্ছে...</div>

        <div id="content" style="display: none;">
            <table class="table table-bordered">
                <tbody>
                    <tr><th style="width: 35%;">ইউজারনেম</th><td id="dt-user" class="fw-bold"></td></tr>
                    <tr><th>গ্রাহকের নাম</th><td id="dt-name"></td></tr>
                    <tr><th>মোবাইল নম্বর</th><td id="dt-phone"></td></tr>
                    <tr><th>বর্তমান প্যাকেজ</th><td id="dt-pkg"></td></tr>
                    <tr><th>অ্যাকাউন্ট স্ট্যাটাস</th><td id="dt-status"></td></tr>
                    <tr><th>সর্বশেষ রিচার্জ/লগইন</th><td id="dt-date"></td></tr>
                    <tr><th>মন্তব্য / ট্রানজেকশন</th><td id="dt-comment"></td></tr>
                </tbody>
            </table>

            <hr class="my-4">
            <h5><i class="fas fa-paper-plane me-2 text-primary"></i>গ্রাহককে সরাসরি SMS পাঠান</h5>
            <div class="mb-3">
                <textarea id="smsText" class="form-control" rows="3" placeholder="মেসেজ লিখুন..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="sendCustomSms()"><i class="fas fa-paper-plane"></i> এসএমএস পাঠান</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('user');

    async function loadCustomerInfo() {
        if (!username) {
            document.getElementById('loading').innerText = 'ইউজার পাওয়া যায়নি!';
            return;
        }

        try {
            const res = await fetch(`/api/customer/${encodeURIComponent(username)}`);
            const data = await res.json();
            if (data.success && data.customer) {
                const c = data.customer;
                document.getElementById('dt-user').innerText = c.username;
                document.getElementById('dt-name').innerText = c.name || c.username;
                document.getElementById('dt-phone').innerText = c.phone || 'N/A';
                document.getElementById('dt-pkg').innerText = c.package || 'Default';
                document.getElementById('dt-status').innerHTML = `<span class="badge ${c.status === 'Active' ? 'bg-success' : 'bg-danger'}">${c.status || 'Active'}</span>`;
                document.getElementById('dt-date').innerText = c.lastRecharge || c.createdAt || 'N/A';
                document.getElementById('dt-comment').innerText = c.comment || 'N/A';

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } else {
                document.getElementById('loading').innerText = 'গ্রাহক তথ্য পাওয়া যায়নি!';
            }
        } catch (e) {
            document.getElementById('loading').innerText = 'সার্ভার সংযোগে সমস্যা!';
        }
    }

    async function sendCustomSms() {
        const phone = document.getElementById('dt-phone').innerText;
        const msg = document.getElementById('smsText').value.trim();

        if (!phone || phone === 'N/A') return alert('গ্রাহকের ফোন নম্বর নেই!');
        if (!msg) return alert('অনুগ্রহ করে মেসেজ লিখুন!');

        try {
            const res = await fetch('/api/send-sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, message: msg })
            });
            const data = await res.json();
            alert(data.message);
        } catch(e) {
            alert('এসএমএস পাঠানো যায়নি!');
        }
    }

    window.onload = loadCustomerInfo;
</script>
</body>
</html>
