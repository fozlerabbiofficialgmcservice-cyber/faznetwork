<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0a3d2e;
            --primary-hover: #0d4d3a;
            --accent-color: #10b981;
            --sidebar-width: 260px;
        }
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0;
            padding: 0;
        }
        
        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: #fff;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .lang-switcher {
            padding: 10px 20px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .lang-switcher select {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .lang-switcher select option {
            background-color: var(--primary-color);
            color: #fff;
        }

        .sidebar-menu { 
            list-style: none; 
            padding: 0; 
            margin: 10px 0 30px 0; 
        }
        .menu-item a, .menu-item .dropdown-toggle {
            color: #a7f3d0;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }
        .menu-item a:hover, 
        .menu-item a.active, 
        .menu-item .dropdown-toggle:hover {
            background-color: rgba(16, 185, 129, 0.2);
            color: #fff;
        }
        .menu-item i { margin-right: 12px; font-size: 17px; }
        
        .dropdown-toggle::after {
            display: none;
        }
        
        .submenu {
            background-color: rgba(0, 0, 0, 0.25);
            list-style: none;
            padding: 0;
            display: none;
        }
        .submenu.show { display: block; }
        .submenu a, .submenu button { 
            padding-left: 48px; 
            font-size: 13.5px; 
        }
        .submenu .submenu a { 
            padding-left: 65px; 
            font-size: 13px; 
            background-color: rgba(0, 0, 0, 0.15);
        }
        
        /* Main Content Layout */
        .main-content {
            margin-left: var(--sidebar-width);
            transition: all 0.3s ease;
            padding: 24px;
        }

        /* Form Card Custom Styling */
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            background: #ffffff;
        }
        .card-custom-header {
            background-color: #ffffff;
            border-bottom: 1px solid #edf2f7;
            padding: 16px 24px;
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-theme {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 9px 22px;
            font-weight: 500;
        }
        .btn-theme:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
        }
        .form-label {
            font-weight: 500;
            font-size: 13.5px;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            padding: 9px 13px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.15);
        }
        
        @media (max-width: 768px) {
            .sidebar { left: calc(-1 * var(--sidebar-width)); }
            .sidebar.show { left: 0; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span data-key="brand">FAZ NETWORK</span>
            <button
