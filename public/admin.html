<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0a3d2e;
            --sidebar-width: 260px;
        }
        body { background-color: #f8fafc; font-family: 'Segoe UI', Arial, sans-serif; }
        .sidebar { width: var(--sidebar-width); background-color: var(--primary-color); color: #fff; position: fixed; top: 0; bottom: 0; left: 0; z-index: 1000; overflow-y: auto; transition: all 0.3s ease; }
        .sidebar-header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .lang-switcher { padding: 10px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; align-items: center; }
        .lang-switcher select { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 4px 8px; border-radius: 5px; cursor: pointer; }
        .sidebar-menu { list-style: none; padding: 0; margin: 10px 0; }
        .menu-item a, .menu-item .dropdown-toggle { color: #a7f3d0; padding: 12px 20px; display: flex; align-items: center; text-decoration: none; width: 100%; text-align: left; background: transparent; border: none; cursor: pointer; font-size: 14px; }
        .menu-item a:hover, .menu-item a.active, .menu-item .dropdown-toggle:hover { background-color: rgba(16, 185, 129, 0.2); color: #fff; }
        .menu-item i { margin-right: 12px; }
        .submenu { background-color: rgba(0, 0, 0, 0.25); list-style: none; padding: 0; display: none; }
        .submenu.show { display: block; }
        .submenu a { padding-left: 48px; font-size: 13.5px; }
        .main-content { margin-left: var(--sidebar-width); padding: 24px; transition: all 0.3s ease; }
        @media (max-width: 768px) { .sidebar { left: -var(--sidebar-width); } .sidebar.show { left: 0; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>FAZ NETWORK</span>
            <button class="btn btn-link text-white d-md-none" onclick="toggleSidebar()">
                <i class="bi bi-x"></i>
            </button>
        </div>

        <div class="lang-switcher">
            <i class="bi bi-translate"></i>
            <select id="langSelect">
                <option value="en" selected>English (USA)</option>
                <option value="bn">বাংলা</option>
            </select>
        </div>

        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="/dashboard">
                    <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
                </a>
            </li>
            <li class="menu-item">
                <button class="dropdown-toggle" onclick="toggleSubmenu(event, this)">
                    <i class="bi bi-people"></i> <span>Customer</span>
                    <i class="bi bi-chevron-down ms-auto arrow-icon"></i>
                </button>
                <ul class="submenu">
                    <li><a href="/customers/all">All Customer</a></li>
                    <li><a href="/customers/add">Add Customer</a></li>
                </ul>
            </li>
            <li class="menu-item">
                <button class="dropdown-toggle" onclick="toggleSubmenu(event, this)">
                    <i class="bi bi-wifi"></i> <span>Hotspot</span>
                    <i class="bi bi-chevron-down ms-auto arrow-icon"></i>
                </button>
                <ul class="submenu">
                    <li><a href="/hotspot/dashboard">Dashboard</a></li>
                    <li><a href="/hotspot/all-user">All Users</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 p-2">
            <div class="container-fluid">
                <button class="btn btn-outline-success d-md-none" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <span class="fs-5 fw-semibold text-secondary d-none d-md-block" id="pageTitle">Dashboard</span>
            </div>
        </nav>
        
        <div id="dynamicPageContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('show'); }

        function toggleSubmenu(event, button) {
            event.stopPropagation();
            const submenu = button.nextElementSibling;
            submenu.classList.toggle('show');
            const arrow = button.querySelector('.arrow-icon');
            if (arrow) arrow.classList.toggle('bi-chevron-up');
        }

        function loadPage(fileName, titleText = '') {
            const contentArea = document.getElementById('dynamicPageContent');
            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle && titleText) pageTitle.innerText = titleText;
            
            contentArea.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="mt-2 text-muted">লোড হচ্ছে...</p>
                </div>
            `;

            fetch('public/' + fileName)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(html => {
                    contentArea.innerHTML = html;
                    const scripts = contentArea.querySelectorAll("script");
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement("script");
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                })
                .catch(err => {
                    contentArea.innerHTML = `
                        <div class="alert alert-danger m-3" role="alert">
                            کون সমস্যা হয়েছে! কন্টেন্ট লোড করা যায়নি (public/${fileName})
                        </div>
                    `;
                });
        }

        document.querySelectorAll('.sidebar-menu a').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('http')) {
                    e.preventDefault();
                    const cleanName = href.replace(/^\//, '').replace(/\//g, '-') + '.html';
                    const linkTitle = this.innerText.trim();
                    document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active', 'text-white'));
                    this.classList.add('active', 'text-white');
                    loadPage(cleanName, linkTitle);
                }
            });
        });

        loadPage('dashboard.html', 'Dashboard');
    </script>
</body>
</html>
