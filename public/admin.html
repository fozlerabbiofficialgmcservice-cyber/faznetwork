        :root {

            --primary-hover: #0d4d3a;

        }
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0;
            padding: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: #fff;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar-header {

            font-size: 20px;
            font-weight: bold;

            align-items: center;
        }
