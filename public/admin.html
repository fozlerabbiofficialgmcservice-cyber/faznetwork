<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - ISP Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; }
        .table-dark { background-color: #1e293b; }
        .table-dark th { background-color: #0f172a; color: #94a3b8; font-weight: 600; border-color: #334155; }
        .table-dark td { border-color: #334155; }
        .stat-card { padding: 16px; border-radius: 10px; }
        .badge-active { background-color: #10b981; color: #fff; }
        .badge-inactive { background-color: #ef4444; color: #fff; }
        .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; border-color: #3b82f6; color: #fff; box-shadow: none; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary">
        <div>
            <h3 class="fw-bold mb-0 text-white"><i class="bi bi-router text-success me-2"></i>FAZ NETWORK</h3>
            <small class="text-secondary">ISP Subscriber & Billing Management</small>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-light btn-sm" onclick="loadDashboard()">
                <i class="bi bi-arrow-clockwise me-1"></i> রিফ্রেশ
            </button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="card stat-card border-success text-center">
                <small class="text-secondary d-block">অনলাইন ইউজার</small>
                <h3 class="fw-bold text-success mb-0" id="onlineUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-warning text-center">
                <small class="text-secondary d-block">অফলাইন</small>
                <h3 class="fw-bold text-warning mb-0" id="offlineUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-info text-center">
                <small class="text-secondary d-block">মোট ইউজার</small>
                <h3 class="fw-bold text-info mb-0" id="totalUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-danger text-center">
                <small class="text-secondary d-block">মেয়াদ উত্তীর্ণ / বাকি</small>
                <h3 class="fw-bold text-danger mb-0" id="expiredUsers">0</h3>
            </div>
        </div>
    </div>

    <!-- Controls: Search & Filters -->
    <div class="card p-3 mb-3">
        <div class="row g-2 align-items-center">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="ইউজারনেম, ফোন বা আইপি দিয়ে খুঁজুন..." oninput="filterData()">
                </div>
            </div>
            <div class="col-md-3 col-6">
                <select id="statusFilter" class="form-select" onchange="filterData()">
                    <option value="all">সব স্ট্যাটাস</option>
                    <option value="online">অনলাইন</option>
                    <option value="offline">অফলাইন</option>
                    <option value="expired">মেয়াদ উত্তীর্ণ</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <select id="packageFilter" class="form-select" onchange="filterData()">
                    <option value="all">সব প্যাকেজ</option>
                </select>
            </div>
            <div class="col-md-2 text-end">
                <span class="badge bg-secondary py-2 px-3 w-100" id="totalFilteredCount">ইউজার: 0</span>
            </div>
        </div>
    </div>

    <!-- Customer Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>ইউজারনেম</th>
                            <th>মোবাইল নম্বর</th>
                            <th>প্যাকেজ</th>
                            <th>কানেকশন MAC</th>
                            <th>আইপি / সাবনেট</th>
                            <th>মেয়াদ (Expire Date)</th>
                            <th>মাসিক বিল</th>
                            <th>স্ট্যাটাস</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
