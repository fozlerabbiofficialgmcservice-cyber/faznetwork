<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #060b13; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 10px; }
        .table-dark { background-color: #0f172a; }
        .table-dark th { background-color: #090e1a; color: #94a3b8; border-color: #1e293b; font-size: 13px; }
        .table-dark td { border-color: #1e293b; font-size: 13px; }
        .stat-card { padding: 14px; border-radius: 10px; }
        .badge-active { background-color: #10b981; color: #fff; }
        .badge-offline { background-color: #475569; color: #fff; }
        .badge-expired { background-color: #f59e0b; color: #fff; }
        .badge-suspended { background-color: #ef4444; color: #fff; }
        .form-control, .form-select { background-color: #060b13; border-color: #1e293b; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #060b13; border-color: #0ea5e9; color: #fff; box-shadow: none; }
        .nav-pills .nav-link { color: #94a3b8; border-radius: 6px; padding: 6px 16px; font-weight: 500; }
        .nav-pills .nav-link.active { background-color: #0284c7; color: #fff; }
        .modal-content { background-color: #0f172a; border: 1px solid #1e293b; color: #fff; }
    </style>
</head>
<body>

<div class="container-fluid py-3">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-secondary">
        <div>
            <h4 class="fw-bold mb-0 text-white"><i class="bi bi-hdd-network-fill text-success me-2"></i>FAZ NETWORK</h4>
            <small class="text-secondary">PPPoE & Hotspot ISP Management Panel</small>
        </div>
        <div class="d-flex gap-2">
            <ul class="nav nav-pills me-3" id="mainPills">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-customers" onclick="loadDashboard()">
                        <i class="bi bi-people-fill me-1"></i> গ্রাহক তালিকা
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-pools" onclick="loadPools()">
                        <i class="bi bi-diagram-3-fill me-1"></i> আইপি পুল (IP Pool)
                    </button>
                </li>
            </ul>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addPoolModal">
                <i class="bi bi-plus-circle me-1"></i> পুল যোগ
            </button>
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                <i class="bi bi-person-plus-fill me-1"></i> কাস্টমার যোগ করুন
            </button>
            <button class="btn btn-outline-info btn-sm" onclick="loadDashboard()">
                <i class="bi bi-arrow-clockwise"></i> রিফ্রেশ
            </button>
        </div>
    </div>

    <div class="tab-content">
        <!-- Customers Tab -->
        <div class="tab-pane fade show active" id="tab-customers">
            <!-- Stats -->
            <div class="row g-3 mb-3">
                <div class="col-md-3 col-6">
                    <div class="card stat-card border-success text-center">
                        <small class="text-secondary d-block">অনলাইন ইউজার</small>
                        <h3 class="fw-bold text-success mb-0" id="onlineUsers">0</h3>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="card stat-card border-secondary text-center">
                        <small class="text-secondary d-block">অফলাইন</small>
                        <h3 class="fw-bold text-secondary mb-0" id="offlineUsers">0</h3>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="card stat-card border-info text-center">
                        <small class="text-secondary d-block">মোট সাবস্ক্রাইবার</small>
                        <h3 class="fw-bold text-info mb-0" id="totalUsers">0</h3>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="card stat-card border-danger text-center">
                        <small class="text-secondary d-block">মেয়াদ উত্তীর্ণ / বন্ধ</small>
                        <h3 class="fw-bold text-danger mb-0" id="expiredUsers">0</h3>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="card p-3 mb-3">
                <div class="row g-2">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="ইউজারনেম, ফোন, MAC বা আইপি খুঁজুন..." oninput="filterData()">
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <select id="statusFilter" class="form-select" onchange="filterData()">
                            <option value="
