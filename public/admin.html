<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #0b1120; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { background-color: #151f32; border: 1px solid #1e293b; border-radius: 10px; }
        .table-dark { background-color: #151f32; }
        .table-dark th { background-color: #0b1120; color: #94a3b8; border-color: #1e293b; font-size: 13px; }
        .table-dark td { border-color: #1e293b; font-size: 13px; }
        .stat-card { padding: 14px; border-radius: 10px; }
        .badge-active { background-color: #10b981; color: #fff; }
        .badge-offline { background-color: #64748b; color: #fff; }
        .badge-expired { background-color: #f59e0b; color: #fff; }
        .badge-suspended { background-color: #ef4444; color: #fff; }
        .form-control, .form-select { background-color: #0b1120; border-color: #1e293b; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #0b1120; border-color: #3b82f6; color: #fff; box-shadow: none; }
        .modal-content { background-color: #151f32; border: 1px solid #1e293b; color: #fff; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <!-- Topbar -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-secondary">
        <div>
            <h3 class="fw-bold mb-0 text-white"><i class="bi bi-hdd-network-fill text-success me-2"></i>FAZ NETWORK</h3>
            <small class="text-secondary">PPPoE & Hotspot ISP Management Panel</small>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                <i class="bi bi-person-plus-fill me-1"></i> কাস্টমার যোগ করুন
            </button>
            <button class="btn btn-outline-info btn-sm" onclick="loadDashboard()">
                <i class="bi bi-arrow-clockwise me-1"></i> রিফ্রেশ
            </button>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="row g-3 mb-3">
        <div class="col-md-3 col-6">
            <div class="card stat-card border-success text-center">
                <small class="text-secondary d-block">অনলাইন ইউজার</small>
                <h3 class="fw-bold text-success mb-0" id="onlineUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-secondary text-center">
                <small class="text-secondary d-block">অফলাইন</small>
                <h3 class="fw-bold text-secondary mb-0" id="offlineUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-info text-center">
                <small class="text-secondary d-block">মোট সাবস্ক্রাইবার</small>
                <h3 class="fw-bold text-info mb-0" id="totalUsers">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card border-danger text-center">
                <small class="text-secondary d-block">মেয়াদ উত্তীর্ণ / বন্ধ</small>
                <h3 class="fw-bold text-danger mb-0" id="expiredUsers">0</h3>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card p-3 mb-3">
        <div class="row g-2">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="ইউজারনেম, ফোন, MAC বা আইপি খুঁজুন..." oninput="filterData()">
                </div>
            </div>
            <div class="col-md-3 col-6">
                <select id="statusFilter" class="form-select" onchange="filterData()">
                    <option value="all">সব স্ট্যাটাস</option>
                    <option value="active">অনলাইন (Active)</option>
                    <option value="offline">অফলাইন</option>
                    <option value="expired">মেয়াদ শেষ (Expired)</option>
                    <option value="suspended">সাসপেন্ডেড</option>
                </select>
            </div>
            <div class="col-md-3 col-6">
                <select id="profileFilter" class="form-select" onchange="filterData()">
                    <option value="all">সব প্যাকেজ/প্রোফাইল</option>
                </select>
            </div>
            <div class="col-md-2 text-end">
                <span class="badge bg-secondary py-2 px-3 w-100" id="customerCountBadge">ইউজার: 0</span>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>নাম / ইউজার</th>
                            <th>মোবাইল</th>
                            <th>প্যাকেজ</th>
                            <th>MAC / কলার আইডি</th>
                            <th>লাইভ IP</th>
                            <th>মেয়াদ (Expire)</th>
                            <th>বিল</th>
                            <th>স্ট্যাটাস</th>
                            <th class="text-center">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody">
                        <tr>
                            <td colspan="9" class="text-center py-5 text-warning">
                                <div class="spinner-border spinner-border-sm me-2"></div> ডাটা লোড হচ্ছে...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Add Customer -->
<div class="modal fade" id="addCustomerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">নতুন কাস্টমার যোগ করুন</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addCustForm" onsubmit="handleAddCustomer(event)">
                    <div class="mb-2">
                        <label class="form-label text-secondary small">গ্রাহকের নাম</label>
                        <input type="text" id="custName" class="form-control" required>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col">
                            <label class="form-label text-secondary small">ইউজারনেম</label>
                            <input type="text" id="custUsername" class="form-control" required>
                        </div>
                        <div class="col">
                            <label class="form-label text-secondary small">পাসওয়ার্ড</label>
                            <input type="text" id="custPassword" class="form-control" value="1234" required>
                        </div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col">
                            <label class="form-label text-secondary small">মোবাইল নম্বর</label>
                            <input type="text" id="custPhone" class="form-control" placeholder="017xxxxxxxx">
                        </div>
                        <div class="col">
                            <label class="form-label text-secondary small">প্যাকেজ প্রোফাইল</label>
                            <input type="text" id="custProfile" class="form-control" placeholder="FZN 30 Mbps" required>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label text-secondary small">মাসিক বিল (টাকা)</label>
                            <input type="number" id="custBill" class="form-control" value="500">
                        </div>
                        <div class="col">
                            <label class="form-label text-secondary small">মেয়াদ (ঐচ্ছিক)</label>
                            <input type="date" id="custExpire" class="form-control">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="saveCustBtn">সেভ ও ক্রিয়েট করুন</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let rawCustomersList = [];

    async function loadDashboard() {
        const tableBody = document.getElementById('customerTableBody');
        tableBody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center py-5 text-warning">
                    <div class="spinner-border spinner-border-sm me-2"></div> ডাটা লোড হচ্ছে...
                </td>
            </tr>
        `;

        try {
            const res = await fetch('/api/admin/customers');
            if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
            const data = await res.json();
            
            rawCustomersList = data.customers || [];
            populateProfiles(rawCustomersList);
            filterData();
        } catch (err) {
            console.error('Fetch error:', err);
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i> ডাটা লোড হতে ব্যর্থ: ${err.message}
                    </td>
                </tr>
            `;
            updateStats(0, 0, 0, 0);
        }
    }

    function populateProfiles(list) {
        const profileSelect = document.getElementById('profileFilter');
        const profiles = [...new Set(list.map(c => c.profile).filter(Boolean))];
        profileSelect.innerHTML = '<option value="all">সব প্যাকেজ/প্রোফাইল</option>';
        profiles.forEach(p => {
            profileSelect.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        const profile = document.getElementById('profileFilter').value;

        const filtered = rawCustomersList.filter(c => {
            const matchQuery = 
                (c.username && c.username.toLowerCase().includes(query)) ||
                (c.name && c.name.toLowerCase().includes(query)) ||
                (c.phone && c.phone.includes(query)) ||
                (c.callerId && c.callerId.toLowerCase().includes(query)) ||
                (c.ipAddress && c.ipAddress.includes(query));

            let matchStatus = true;
            if (status !== 'all') {
                matchStatus = (c.liveStatus === status);
            }

            const matchProfile = (profile === 'all' || c.profile === profile);

            return matchQuery && matchStatus && matchProfile;
        });

        renderTable(filtered);
        updateCounters(rawCustomersList);
    }

    function renderTable(list) {
        const tableBody = document.getElementById('customerTableBody');
        document.getElementById('customerCountBadge').innerText = `ইউজার: ${list.length}`;

        if (!list || list.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-secondary">কোনো গ্রাহকের তথ্য পাওয়া যায়নি।</td></tr>`;
            return;
        }

        let html = '';
        list.forEach(c => {
            let statusBadge = '';
            if (c.liveStatus === 'active') statusBadge = '<span class="badge badge-active">অনলাইন</span>';
            else if (c.liveStatus === 'suspended') statusBadge = '<span class="badge badge-suspended">স্থগিত</span>';
            else if (c.liveStatus === 'expired') statusBadge = '<span class="badge badge-expired">মেয়াদ শেষ</span>';
            else statusBadge = '<span class="badge badge-offline">অফলাইন</span>';

            html += `
                <tr>
                    <td>
                        <strong class="text-white">${c.username}</strong>
                        <small class="d-block text-secondary">${c.name || ''}</small>
                    </td>
                    <td>${c.phone || '-'}</td>
                    <td><span class="badge bg-secondary">${c.profile || '-'}</span></td>
                    <td><code>${c.callerId || '-'}</code></td>
                    <td><code>${c.ipAddress || '-'}</code></td>
                    <td>${c.expireDate || '-'}</td>
                    <td>৳ ${c.bill || 0}</td>
                    <td>${statusBadge}</td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-success" title="৩০ দিন রিনিউ" onclick="triggerAction('${c.username}', 'renew', { days: 30 })">
                                <i class="bi bi-cash-stack"></i>
                            </button>
                            <button class="btn btn-outline-warning" title="এসএমএস নোটিশ" onclick="triggerAction('${c.username}', 'send-notice')">
                                <i class="bi bi-chat-dots"></i>
                            </button>
                            <button class="btn btn-outline-danger" title="সাসপেন্ড / একটিভ" onclick="toggleStatus('${c.username}', '${c.status}')">
                                <i class="bi bi-power"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
    }

    function updateCounters(list) {
        let online = 0, offline = 0, expired = 0;
        list.forEach(c => {
            if (c.liveStatus === 'active') online++;
            else if (c.liveStatus === 'offline') offline++;
            if (c.liveStatus === 'expired' || c.liveStatus === 'suspended') expired++;
        });
        updateStats(online, offline, list.length, expired);
    }

    function updateStats(online, offline, total, expired) {
        document.getElementById('onlineUsers').innerText = online;
        document.getElementById('offlineUsers').innerText = offline;
        document.getElementById('totalUsers').innerText = total;
        document.getElementById('expiredUsers').innerText = expired;
    }

    async function triggerAction(username, action, extra = {}) {
        if (!confirm(`আপনি কি ইউজার (${username}) এর জন্য এই অ্যাকশনটি সম্পন্ন করতে চান?`)) return;
        try {
            const res = await fetch('/api/admin/customers/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, action, ...extra })
            });
            const data = await res.json();
            alert(data.message || (data.success ? 'সফল হয়েছে' : 'ব্যর্থ হয়েছে'));
            loadDashboard();
        } catch (e) {
            alert('এরর: ' + e.message);
        }
    }

    function toggleStatus(username, currentStatus) {
        const nextStatus = currentStatus === 'suspended' ? 'active' : 'suspended';
        triggerAction(username, 'status', { status: nextStatus });
    }

    async function handleAddCustomer(e) {
        e.preventDefault();
        const payload = {
            name: document.getElementById('custName').value,
            username: document.getElementById('custUsername').value,
            password: document.getElementById('custPassword').value,
            phone: document.getElementById('custPhone').value,
            profile: document.getElementById('custProfile').value,
            bill: document.getElementById('custBill').value,
            expireDate: document.getElementById('custExpire').value
        };

        try {
            const res = await fetch('/api/admin/customers/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert('কাস্টমার সফলভাবে তৈরি হয়েছে!');
                bootstrap.Modal.getInstance(document.getElementById('addCustomerModal')).hide();
                document.getElementById('addCustForm').reset();
                loadDashboard();
            } else {
                alert(data.message || 'ব্যর্থ হয়েছে');
            }
        } catch (e) {
            alert('এরর: ' + e.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
