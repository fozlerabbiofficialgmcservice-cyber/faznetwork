<div class="card card-custom">
    <div class="card-custom-header">
        <i class="bi bi-people-fill text-success fs-5"></i>
        <span class="fs-5" data-key="all_user">All Users</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Username</th>
                        <th>IP Address</th>
                        <th>MAC Address</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function fetchHotspotUsers() {
        const tableBody = document.getElementById('userTableBody');
        tableBody.innerHTML = `
            <tr>
                <td colspan="4" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                    <span class="ms-2">ডাটা ফেচ করা হচ্ছে...</span>
                </td>
            </tr>
        `;

        // Update with your actual API endpoint
        fetch('/api/hotspot/users')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                tableBody.innerHTML = '';
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">কোন ইউজার পাওয়া যায়নি।</td></tr>`;
                    return;
                }
                
                data.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="ps-4 fw-semibold">${user.username}</td>
                        <td>${user.ipAddress || 'N/A'}</td>
                        <td>${user.macAddress || 'N/A'}</td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">ডাটা ফেচ করতে সমস্যা হয়েছে।</td></tr>`;
            });
    }

    fetchHotspotUsers();
</script>
