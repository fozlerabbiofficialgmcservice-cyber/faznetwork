<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হটস্পট ইউজার্স - FAZ NETWORK</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #16a085;
            --danger-color: #c0392b;
            --light-color: #ecf0f1;
            --dark-color: #2d3436;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light-color); margin: 0; padding: 20px; color: var(--dark-color); }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: var(--primary-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; margin-bottom: 20px; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn { background-color: var(--secondary-color); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-danger { background-color: var(--danger-color); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: var(--primary-color); color: #fff; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-active { color: var(--secondary-color); font-weight: bold; }
        .status-disabled { color: var(--danger-color); font-weight: bold; }
        .loading-spinner { text-align: center; font-size: 1.5rem; color: var(--secondary-color); padding: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>হটস্পট ইউজার্স</h1>
    <div class="controls">
        <a href="javascript:void(0)" class="btn" onclick="openAddUserModal()"><i class="fa fa-plus"></i> নতুন ইউজার</a>
        <a href="javascript:void(0)" class="btn" onclick="fetchHotspotUsers()"><i class="fa fa-sync"></i> রিফ্রেশ</a>
    </div>

    <div id="loading" class="loading-spinner">
        <i class="fa fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে...
    </div>

    <table id="usersTable" class="hidden">
        <thead>
            <tr>
                <th>ইউজারনেম</th>
                <th>প্রোফাইল</th>
                <th>সার্ভার</th>
                <th>আপটাইম</th>
                <th>ডাটা ব্যবহার</th>
                <th>মন্তব্য</th>
                <th>স্ট্যাটাস</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <!-- Data will be inserted here -->
        </tbody>
    </table>
</div>

<!-- Simple Add User Modal -->
<div id="userModal" style="display:none; position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4);">
    <div style="background-color:#fefefe; margin:10% auto; padding:20px; border:1px solid #888; width:50%; border-radius:8px;">
        <span onclick="closeModal()" style="color:#aaa; float:right; font-size:28px; font-weight:bold; cursor:pointer;">&times;</span>
        <h2>নতুন ইউজার তৈরি করুন</h2>
        <form id="addUserForm">
            <input type="text" id="username" placeholder="ইউজারনেম" required style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:4px;"><br>
            <input type="text" id="password" placeholder="পাসওয়ার্ড" required style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:4px;"><br>
            <select id="profileSelect" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:4px;"></select><br>
            <select id="serverSelect" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:4px;"></select><br>
            <button type="submit" class="btn">তৈরি করুন</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetchHotspotUsers();
        fetchProfiles();
        fetchServerProfiles();
    });

    async function fetchHotspotUsers() {
        showLoading();
        try {
            const response = await fetch('/api/hotspot/users');
            const data = await response.json();
            renderUsers(data);
        } catch (error) {
            console.error('Error fetching users:', error);
            alert('ইউজার ডাটা লোড করতে সমস্যা হয়েছে।');
        } finally {
            hideLoading();
        }
    }

    function renderUsers(users) {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = '';
        users.forEach(user => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${user.username}</td>
                <td>${user.profile}</td>
                <td>${user.server}</td>
                <td>${user.uptime}</td>
                <td>ইন: ${user.bytesIn || '-'} | আউট: ${user.bytesOut || '-'}</td>
                <td>${user.comment}</td>
                <td><span class="${user.disabled ? 'status-disabled' : 'status-active'}">${user.disabled ? 'বন্ধ' : 'সচল'}</span></td>
                <td>
                    <button class="btn btn-danger" onclick="deleteUser('${user.username}')"><i class="fa fa-trash"></i></button>
                </td>
            `;
            tableBody.appendChild(row);
        });
        document.getElementById('usersTable').classList.remove('hidden');
    }

    async function deleteUser(username) {
        if (!confirm(`আপনি কি "${username}" ইউজারটি ডিলিট করতে চান?`)) return;
        try {
            const response = await fetch(`/api/hotspot/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
            const result = await response.json();
            if (result.success) {
                alert('ইউজার ডিলিট হয়েছে।');
                fetchHotspotUsers();
            } else {
                alert('ডিলিট করতে ব্যর্থ হয়েছে: ' + result.message);
            }
        } catch (error) {
            console.error('Error deleting user:', error);
        }
    }

    async function fetchProfiles() {
        try {
            const response = await fetch('/api/hotspot/profiles');
            const profiles = await response.json();
            const select = document.getElementById('profileSelect');
            profiles.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name + ` (${p.type})`;
                select.appendChild(opt);
            });
        } catch (e) { console.error(e); }
    }

    async function fetchServerProfiles() {
        try {
            const response = await fetch('/api/hotspot/server-profiles');
            const servers = await response.json();
            const select = document.getElementById('serverSelect');
            servers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name;
                select.appendChild(opt);
            });
        } catch (e) { console.error(e); }
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const profile = document.getElementById('profileSelect').value;
        const server = document.getElementById('serverSelect').value;

        try {
            const response = await fetch('/api/hotspot/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, profile, server })
            });
            const result = await response.json();
            if (result.success) {
                alert('ইউজার তৈরি হয়েছে।');
                closeModal();
                fetchHotspotUsers();
            } else {
                alert('ব্যর্থ হয়েছে: ' + result.message);
            }
        } catch (error) {
            console.error('Error adding user:', error);
        }
    });

    function showLoading() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('usersTable').classList.add('hidden');
    }

    function hideLoading() {
        document.getElementById('loading').classList.add('hidden');
    }

    function openAddUserModal() {
        document.getElementById('userModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('userModal').style.display = 'none';
        document.getElementById('addUserForm').reset();
    }
</script>

</body>
</html>
