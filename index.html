<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - সেলফ রিচার্জ ও লগইন পোর্টাল</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; width: 100%; max-width: 420px; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #1a73e8; font-size: 24px; }
        .header p { margin: 5px 0 0; color: #666; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #1a73e8; }
        .btn { width: 100%; padding: 13px; background: #e2136e; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #c20f5d; }
        .instruction { background: #fff4e5; border-left: 4px solid #ff9800; padding: 12px; border-radius: 4px; margin-top: 15px; font-size: 13px; color: #663c00; }
        .alert { display: none; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .alert-success { background: #e6f4ea; color: #137333; }
        .alert-error { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>FAZ NETWORK</h2>
        <p>ইন্টারনেট বিল পরিশোধ ও অটো অ্যাক্টিভেশন</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="rechargeForm">
        <div class="form-group">
            <label for="username">ইউজার আইডি / ইউজারনেম</label>
            <input type="text" id="username" placeholder="আপনার ইউজার আইডি দিন" required>
        </div>

        <div class="form-group">
            <label for="group">কানেকশন ধরণ (গ্রুপ)</label>
            <select id="group">
                <option value="pppoe">PPPoE ব্রডব্যান্ড</option>
                <option value="hotspot">হটস্পট (Wi-Fi)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">বিকাশ মোবাইল নাম্বার</label>
            <input type="tel" id="phone" placeholder="যে নাম্বার থেকে টাকা পাঠাবেন" required>
        </div>

        <button type="submit" class="btn" id="submitBtn">রিচার্জ কনফার্ম করুন</button>
    </form>

    <div class="instruction">
        <strong>পেমেন্ট নিয়ম:</strong>
        <p style="margin: 5px 0 0;">বিকাশে Send Money করার সময় <strong>Reference (রেফারেন্স)</strong> ঘরে আপনার সঠিক <strong>ইউজার আইডি</strong> লিখবেন। টাকা আসা মাত্রই রাউটারে ইন্টারনেট চালু হয়ে যাবে।</p>
    </div>
</div>

<script>
    const form = document.getElementById('rechargeForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = 'অপেক্ষা করুন...';

        const payload = {
            username: document.getElementById('username').value.trim(),
            group: document.getElementById('group').value,
            phone: document.getElementById('phone').value.trim()
        };

        try {
            const res = await fetch('/api/request-recharge', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            alertBox.style.display = 'block';

            if (data.success) {
                alertBox.className = 'alert alert-success';
                alertBox.innerText = data.message;
                form.reset();
            } else {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = data.message || 'কোনো সমস্যা হয়েছে!';
            }
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-error';
            alertBox.innerText = 'সার্ভার রেসপন্স করছে না।';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'রিচার্জ কনফার্ম করুন';
        }
    });
</script>

</body>
</html>
